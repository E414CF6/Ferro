services:
  serve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serve-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_DRIVER=postgres
      - DATABASE_URL=postgres://serve:password@postgres:5432/serve
      - DB_MAX_CONNECTIONS=25
      - DB_MIN_CONNECTIONS=5
      - DB_AUTO_MIGRATE=true
      - DB_SEED_DATA=false
      - JWT_SECRET=${JWT_SECRET:-generate-a-secure-random-secret-in-production-at-least-32-chars!}
      - JWT_EXPIRATION_DAYS=30
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_MAX_REQUESTS=120
      - RATE_LIMIT_WINDOW_SECS=60
      - ENABLE_GRAPHIQL=false
      - ENABLE_INTROSPECTION=false
      - LOG_FORMAT=json
      - RUST_LOG=info,serve=info,tower_http=info,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - serve_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: serve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serve
      POSTGRES_PASSWORD: password
      POSTGRES_DB: serve
    ports:
      - "5432:5432"
    volumes:
      - serve_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U serve -d serve" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  serve_pg_data:
  serve_uploads:
