[package]
name = "serve"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1.53", features = ["full"] }
async-graphql = { version = "7.2", features = ["chrono",
    "uuid",
    "tracing",
    "log",
    "dataloader",
] }
async-graphql-axum = "7.2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.7", features = ["cors",
    "trace",
    "request-id",
    "util",
    "set-header",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter",
    "json",
    "fmt",
    "ansi",
] }
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
argon2 = { version = "0.5", features = ["std"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
] }
async-trait = "0.1"
dotenvy = "0.15.7"
base64 = "0.22"
totp-rs = { version = "5.6", default-features = false, features = ["gen_secret",
    "otpauth",
] }
strum = "0.28"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"
unnecessary_map_or = "allow"
too_many_arguments = "allow"
