services:
  postgres:
    image: postgres:16-alpine
    container_name: serve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serve
      POSTGRES_PASSWORD: password
      POSTGRES_DB: serve
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U serve -d serve" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - serve_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: serve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - serve_redis_data:/data

volumes:
  serve_pg_data:
  serve_redis_data:
